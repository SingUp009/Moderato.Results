name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # NuGet Trusted Publishing
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - run: dotnet test -c Release

      - run: dotnet run tools/Generate.cs
      - run: git diff --exit-code

      - name: Pack
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: dotnet pack src/Moderato.Results -c Release -o artifacts

      - name: Pack (tagged release)
        if: startsWith(github.ref, 'refs/tags/v')
        run: dotnet pack src/Moderato.Results -c Release -o artifacts -p:Version="${GITHUB_REF_NAME#v}"

      - name: NuGet login
        if: startsWith(github.ref, 'refs/tags/v')
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet
        if: startsWith(github.ref, 'refs/tags/v')
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          -s https://api.nuget.org/v3/index.json
          -k "${{ steps.nuget-login.outputs.NUGET_API_KEY }}"
          --skip-duplicate
