name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - run: dotnet test -c Release

      - run: dotnet run tools/Generate.cs
      - run: git diff --exit-code

      - run: dotnet pack src/Moderato.Results -c Release -o artifacts

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      contents: read
      id-token: write # NuGet Trusted Publishing
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - run: dotnet pack src/Moderato.Results -c Release -o artifacts -p:Version="${GITHUB_REF_NAME#v}"

      - name: NuGet login
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - run: >
          dotnet nuget push "artifacts/*.nupkg"
          -s https://api.nuget.org/v3/index.json
          -k "${{ steps.nuget-login.outputs.NUGET_API_KEY }}"
          --skip-duplicate
